name: Build apt image
on:
  workflow_dispatch:
    inputs:
      commit-id:
        description: 'Commit to build from'
        required: true
        type: string
jobs:
  build-apt-image:
    permissions:
      packages: write
      contents: read
    uses: mullvad/rsw-public/.github/workflows/build-apt-image.yaml@master
    with:
      commit-id: ${{ inputs.commit-id }}
      repo-name: wgephemeralpeer
      dockerfile: Dockerfile
